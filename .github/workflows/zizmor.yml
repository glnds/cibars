name: zizmor

on:
  push:
    # renovate/**: Renovate branch-automerge (no PRs) needs green checks
    # on its branch before it fast-forwards master.
    branches: [master, 'renovate/**']
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']

permissions: {}

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools (mise)
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run zizmor
        run: zizmor --format=sarif --min-severity=medium . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF to GitHub code scanning
        # Best-effort: GitHub Code Scanning is gated by plan/repo settings.
        # zizmor's exit code already fails the job on findings; SARIF upload
        # is purely for Security-tab visibility, not the gate.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: zizmor
